services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_instituto_digital
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres_instituto_digital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: minio_instituto_digital
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API S3 → STORAGE_ENDPOINT
      - "9001:9001" # consola web (http://localhost:9001)
    volumes:
      - minio_data:/data

  # Crea el bucket al levantar (createBucket ya es idempotente en la app, pero
  # esto deja el entorno listo sin depender del primer request). Contenedor
  # efímero que sale en cuanto termina.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb -p local/instituto-digital-storage;
      mc mb -p local/instituto-digital-public;
      exit 0;
      "

  # Servidor SMTP de desarrollo: recibe todos los correos sin entregarlos.
  # SMTP en 1025 (SMTP_HOST=localhost, SMTP_PORT=1025), bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: mailpit_instituto_digital
    ports:
      - "1025:1025"
      - "8025:8025"

  # Redis de desarrollo (REDIS_URL="redis://localhost:6379"). Lo comparten la
  # caché y las colas: nunca expulsa claves (BullMQ perdería trabajos) y guarda
  # en disco cada segundo (docs/queues/00-colas.md).
  redis:
    image: redis:7-alpine
    container_name: redis_instituto_digital
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
  minio_data: